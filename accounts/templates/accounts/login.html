{% extends 'accounts/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-success mb-3">Welcome Back</h3>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 fw-semibold">Log In</button>
                </form>
                <p class="text-center mt-3 mb-0 small">
                    New to KaLocal? <a href="{% url 'register' %}" class="text-success fw-semibold">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
