{% extends 'accounts/base.html' %}

{% block title %}Delete Product | KaLocal{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="kl-card kl-card-red p-4 p-md-5 text-center">
            <h2 class="font-lobster text-kl-red mb-3">Remove Product?</h2>
            
            <p class="fs-5 mb-4">
                Are you sure you want to permanently delete <strong>"{{ product.name }}"</strong> from your catalog? This action cannot be undone.
            </p>
            
            <form method="post" class="d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="{% url 'vendor_dashboard' %}" class="btn-kl btn-kl-outline text-decoration-none">Cancel</a>
                <button type="submit" class="btn-kl btn-kl-red">Yes, Remove It</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
