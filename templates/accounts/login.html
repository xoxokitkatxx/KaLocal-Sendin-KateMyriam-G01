{% extends 'base.html' %}
{% block title %}Login | KaLocal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-success mb-1">Welcome Back</h3>
                <p class="text-muted small mb-4">Log in to access your KaLocal barangay dashboard.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-semibold">Log In</button>
                </form>

                <hr class="my-4">
                <p class="text-center small mb-0">
                    New to KaLocal? <a href="{% url 'register' %}" class="text-success fw-semibold">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
